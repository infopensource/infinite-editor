<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>编辑器对话框设计提案</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#202a36;background:#e9edf2}button{font:inherit;cursor:pointer}.toolbar{position:relative;z-index:2;padding:18px max(24px,calc((100vw - 1200px)/2));background:#fff;border-bottom:1px solid #d8dee6;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.toolbar h1{margin:0;font-size:18px;letter-spacing:.01em}.toolbar p{margin:2px 0 0;color:#667383;font-size:12px}.controls{display:flex;gap:6px;flex-wrap:wrap}.controls button{background:#fff;border:1px solid #cbd4df;border-radius:5px;padding:7px 12px;color:#344354}.controls button.active{color:#174f83;border-color:#3578b4;background:#edf5fc}.wrap{max-width:1200px;margin:22px auto;padding:0 24px}.scheme-title{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}.scheme-title strong{font-size:18px}.scheme-title span{color:#687689;font-size:13px}.stage{position:relative;height:560px;overflow:hidden;border:1px solid #c9d2dd;background:#f6f8fb;box-shadow:0 1px 3px #27384a12}.app-title{height:42px;background:#244e74;color:#e8f0f7;display:flex;align-items:center;padding:0 20px;gap:18px;font-size:13px}.app-title b{font-weight:500;color:#fff}.app-tabs{height:44px;background:#f8fafc;border-bottom:1px solid #d9e0e8;padding:10px 20px;color:#35485c;word-spacing:25px}.app-main{display:flex;height:calc(100% - 86px)}.app-nav{width:190px;padding:25px 18px;border-right:1px solid #dce2e9;background:#f4f6f9}.app-nav b{display:block;font-size:24px;margin-bottom:20px}.app-nav div{padding:8px 12px;margin:4px 0}.app-nav .selected{background:#dce9f5;color:#245a88;border-left:3px solid #2a689d}.app-content{flex:1;padding:26px 48px}.app-content h2{font-size:25px;margin:0 0 4px}.app-content p{margin:0 0 22px;color:#687687}.rule{height:1px;background:#d6dde6;margin-bottom:25px}.fake-document{height:92px;display:flex;align-items:center;gap:18px}.fake-icon{border:1px solid #cbd8e4;padding:26px 18px;color:#245a88;background:#ecf2f8;font-weight:700}.fake-document b{font-size:19px}.fake-document small{color:#788594}.shade{position:absolute;inset:0;background:rgba(24,35,49,.32);display:grid;place-items:center;padding:20px}.modal{width:min(100%,500px);background:#fff;box-shadow:0 14px 38px #14243b38;color:#223044}.modal header h3{margin:0;font-size:18px;font-weight:600}.modal header p{margin:8px 0 0;color:#5d6a78;font-size:13px}.modal .detail{color:#4c5a69;font-size:13px}.modal .error{color:#a93228;font-size:12px;margin-top:12px}.modal footer{display:flex;align-items:center;gap:8px}.modal button{padding:8px 13px;border:1px solid #b9c7d5;background:#fff;color:#26374b;white-space:nowrap}.modal button.primary{border-color:#245f95;background:#245f95;color:white}.modal button.danger{color:#a03024}.modal input{width:100%;border:1px solid #b9c7d5;background:#fff;color:#223044;padding:9px 10px;font:inherit;margin:5px 0 12px}.modal label{display:block;color:#4d5d6e;font-size:12px}.modal .check{display:flex;gap:9px;align-items:center;margin:4px 0 10px}.modal .check input{width:auto;margin:0}.modal .body{padding:0}.modal .progress{height:5px;background:#e4e9ee;margin:17px 0 2px}.modal .progress i{display:block;width:56%;height:100%;background:#3779ab}.variant-a .modal{width:min(100%,460px);border:1px solid #9caec0;border-radius:5px}.variant-a .modal header{padding:22px 24px 0}.variant-a .modal .body{padding:14px 24px 18px}.variant-a .modal footer{justify-content:flex-end;padding:14px 24px 20px}.variant-a .modal button{border-radius:4px;min-width:74px}.variant-a .modal .danger{margin-right:auto;border:0;padding-left:0}.variant-b .modal{width:min(100%,520px);border:1px solid #bbc8d5;border-top:3px solid #23679c;border-radius:2px;box-shadow:0 12px 32px #14243b2e}.variant-b .modal header{padding:21px 26px 18px;border-bottom:1px solid #e1e5e9}.variant-b .modal .body{padding:16px 26px}.variant-b .modal footer{padding:16px 26px;border-top:1px solid #e1e5e9;justify-content:flex-end}.variant-b .modal button{border-radius:2px;min-width:82px}.variant-b .modal .danger{margin-right:auto;border:0;padding-left:0}.variant-c .shade{background:rgba(24,35,49,.22)}.variant-c .modal{width:min(100%,440px);border:1px solid #d1d9e1;border-radius:10px;box-shadow:0 16px 42px #14243b2b}.variant-c .modal header{padding:27px 28px 0}.variant-c .modal header h3{font-size:20px}.variant-c .modal .body{padding:15px 28px 25px}.variant-c .modal footer{padding:0 28px 27px;justify-content:flex-end}.variant-c .modal button{border-radius:6px}.variant-c .modal .danger{margin-right:auto;border:0;padding-left:0}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 30px}.note{background:#fff;border:1px solid #d8e0e8;padding:16px 18px}.note b{display:block;font-size:15px;margin-bottom:5px}.note p{margin:0;font-size:13px;color:#5e6d7d}.note.current{border-color:#4480b3;box-shadow:inset 0 2px #4480b3}@media(max-width:760px){.wrap{padding:0 10px;margin-top:10px}.stage{height:500px}.app-nav{width:100px;padding:16px 8px}.app-content{padding:20px}.toolbar{padding:12px}.notes{grid-template-columns:1fr}.modal footer{flex-wrap:wrap}.modal .danger{margin-right:0;width:100%;text-align:left}.scheme-title{display:block}}
</style>
</head>
<body>
<div class="toolbar"><div><h1>对话框设计提案</h1><p>点击方案和场景，查看同一套规范如何覆盖不同操作</p></div><div class="controls" id="schemes"><button data-scheme="a" class="active">A · 编辑器原生</button><button data-scheme="b">B · 桌面办公</button><button data-scheme="c">C · 轻量聚焦</button></div><div class="controls" id="scenes"><button data-scene="save" class="active">保存确认</button><button data-scene="open">打开文档</button><button data-scene="error">操作失败</button><button data-scene="loading">处理中</button></div></div>
<main class="wrap"><div class="scheme-title"><strong id="scheme-name"></strong><span id="scheme-subtitle"></span></div><div class="stage variant-a" id="stage"><div class="app-title">自动保存 ◯　　↶　↷　▣　　<b>未命名文档*</b></div><div class="app-tabs">文件　 开始　 插入　 绘图　 布局　 引用　 审阅　 视图</div><div class="app-main"><aside class="app-nav"><b>文件</b><div class="selected">信息</div><div>新建</div><div>打开</div><div>保存</div><div>另存为</div></aside><section class="app-content"><h2>文档信息</h2><p>查看当前文档的位置和保存状态。</p><div class="rule"></div><div class="fake-document"><div class="fake-icon">MD</div><div><small>新建文档</small><br><b>未命名文档</b><br><small>尚未选择保存位置</small></div></div></section></div><div class="shade"><div class="modal" role="presentation"><header id="modal-header"></header><div class="body" id="modal-body"></div><footer id="modal-footer"></footer></div></div></div><div class="notes" id="notes"><div class="note current" data-note="a"><b>A · 编辑器原生</b><p>紧凑、清晰，标题与操作同属一块白色界面。适合频繁出现的确认与文件操作。</p></div><div class="note" data-note="b"><b>B · 桌面办公</b><p>细蓝线和分隔线形成明确的桌面窗口感。适合希望延续现有 Word 风格的界面。</p></div><div class="note" data-note="c"><b>C · 轻量聚焦</b><p>更少边框和更宽的留白，强调文字与主操作。适合较少打断的编辑体验。</p></div></div></main>
<script>
const labels={a:['A · 编辑器原生','克制的桌面编辑器语言 · 推荐'],b:['B · 桌面办公','细分隔线和蓝色识别线'],c:['C · 轻量聚焦','柔和、简洁、较少视觉元素']};
const scenes={save:{header:'<h3>保存对当前文档的更改吗？</h3>',body:'<div class="detail">新建文档前，可以保存未命名文档中的修改。</div>',footer:'<button class="danger">不保存</button><button>取消</button><button class="primary">保存并新建</button>'},open:{header:'<h3>打开文档</h3>',body:'<label>文件路径</label><input value="/home/user/Documents/notes.md" aria-label="文件路径"><label class="check"><input type="checkbox" checked> 自动检测编码</label><label class="check"><input type="checkbox"> 以只读方式打开</label>',footer:'<button>取消</button><button class="primary">打开</button>'},error:{header:'<h3>无法保存文档</h3>',body:'<div class="detail">保存位置不可用。请检查路径，或选择其他位置。</div><div class="error">详细信息：无法写入目标文件</div>',footer:'<button>关闭</button><button class="primary">另存为</button>'},loading:{header:'<h3>正在打开文档</h3>',body:'<div class="detail">正在读取 notes.md，请稍候。</div><div class="progress"><i></i></div>',footer:'<button>取消</button>'}};
let scheme='a',scene='save';function render(){document.getElementById('stage').className='stage variant-'+scheme;document.getElementById('scheme-name').textContent=labels[scheme][0];document.getElementById('scheme-subtitle').textContent=labels[scheme][1];for(const part of ['header','body','footer'])document.getElementById('modal-'+part).innerHTML=scenes[scene][part];document.querySelectorAll('[data-scheme]').forEach(b=>b.classList.toggle('active',b.dataset.scheme===scheme));document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===scene));document.querySelectorAll('[data-note]').forEach(n=>n.classList.toggle('current',n.dataset.note===scheme))}document.getElementById('schemes').onclick=e=>{const b=e.target.closest('[data-scheme]');if(b){scheme=b.dataset.scheme;render()}};document.getElementById('scenes').onclick=e=>{const b=e.target.closest('[data-scene]');if(b){scene=b.dataset.scene;render()}};render();
</script>
</body>
</html>
