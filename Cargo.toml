[package]
name = "infinite-editor"
version = "0.1.0"
authors = ["hacktor <inf2project@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "4acbf53dd86b1b3dc8cd7e409002bf922f37b4e1", default-features = false }
base64 = "0.22"
dioxus = { version = "0.7.1", features = ["router"] }
futures-channel = "0.3"
tokio = { version = "1", features = ["time"], optional = true }
markdown = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
url = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = { version = "0.15.4", optional = true, default-features = false }
anydoc = { version = "0.2.4", optional = true }
tungstenite = { version = "0.27", optional = true }
png = { version = "0.17.16", optional = true }
quick-xml = { version = "0.41", optional = true }

[features]
default = ["desktop"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web", "dioxus-primitives/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop", "dep:rfd", "dep:gtk", "dep:tokio", "dep:anydoc", "dep:tungstenite", "dep:png", "dep:quick-xml"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", optional = true }
rfd = { version = "0.15.4", optional = true, default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSDictionary", "NSString"] }
